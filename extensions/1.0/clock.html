<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Clock</title>
    <style>
        body {
            background-color: #121212;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            position: relative;
        }
        #clock {
            font-size: 8rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.6);
        }
        /* ✨ ボタン全体のスタイル（共通） */
        .btn {
            position: absolute;
            top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 6px 14px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .btn:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
        }
        /* 12H/24Hボタンは左端から20px */
        #toggle-btn {
            left: 20px;
        }
        /* 💡 背景変更ボタンは12Hボタンのとなりに配置（左端から140px） */
        #bg-btn {
            left: 140px;
        }
        /* ファイル選択画面を出すための見えないボタン */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <button id="toggle-btn" class="btn">24H / 12H</button>
    <button id="bg-btn" class="btn">背景変更</button>
    
    <input type="file" id="file-input" accept="image/jpeg, image/png">

    <div id="clock">--:--:--</div>

    <script src="clock.js"></script>
</body>
</html>
